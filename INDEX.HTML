<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemograman Web</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card{
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover{
            transform: scale(1.03);
        }

        h1{
            color: #0077ff;
            margin-bottom: 20px;
            font-size: 32px;
        }

        h2, h3, h4{
            margin: 10px 0;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Pemograman Web</h1>
        <h2>NAMA : MhdZikriNazwaHerfa</h2>
        <h3>NPM : 243510225</h3>
        <h4>KELAS : 4D</h4>
    </div>

</body>
</html>
